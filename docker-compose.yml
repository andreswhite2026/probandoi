# ===========================================================================
# SismoWatch — entorno de desarrollo
# ---------------------------------------------------------------------------
# Puertos publicados al host: SOLO los estrictamente necesarios.
#   Airflow  -> 8082 (la UI que se usa a diario)
#   API/web  -> se añaden en sus fases (8000 / 3000)
# PostgreSQL y MinIO quedan en la red interna: no se exponen a Internet ni al
# host. Para inspeccionarlos se usan `docker compose exec` (ver Makefile).
# ===========================================================================
name: sismowatch

# Configuración común de los contenedores de Airflow (evita duplicar 30 líneas
# de entorno en cada servicio).
x-airflow-common: &airflow-common
  image: sismowatch/airflow:2.10.5-py3.11
  build:
    context: .
    dockerfile: infra/airflow/Dockerfile
  env_file:
    - .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB_NAME}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "4"
    AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: "1"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    # --- Datos de la aplicación -------------------------------------------
    SISMO_DB_HOST: postgres
    SISMO_DB_PORT: "5432"
    SISMO_DB_NAME: ${POSTGRES_DB}
    # --- Spark / MinIO -----------------------------------------------------
    S3_ENDPOINT: http://minio:9000
    AWS_ACCESS_KEY_ID: ${MINIO_SPARK_USER}
    AWS_SECRET_ACCESS_KEY: ${MINIO_SPARK_PASSWORD}
    AWS_REGION: ${MINIO_REGION}
    JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    PYSPARK_PYTHON: python3
    PYSPARK_DRIVER_PYTHON: python3
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/include:/opt/airflow/include
    - ./airflow/tests:/opt/airflow/tests
    - ./spark/jobs:/opt/airflow/spark/jobs:ro
    - airflow_logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    postgres:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully
  networks:
    - sismowatch-net

services:
  # -------------------------------------------------------------------------
  # PostgreSQL: datos de negocio (raw/staging/curated/app) + metadatos Airflow
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: sismowatch-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/sql:ro
      - ./db/init/00-run-sql.sh:/docker-entrypoint-initdb.d/00-run-sql.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - sismowatch-net

  # -------------------------------------------------------------------------
  # MinIO: data lake S3-compatible (Bronze y Silver)
  # -------------------------------------------------------------------------
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: sismowatch-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      # /dev/tcp es una función de bash: comprueba que el puerto S3 acepta conexiones.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - sismowatch-net

  # -------------------------------------------------------------------------
  # Inicialización de MinIO: buckets + usuarios/políticas. Termina y sale.
  # -------------------------------------------------------------------------
  minio-init:
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
    container_name: sismowatch-minio-init
    env_file:
      - .env
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MC_CONFIG_DIR: /tmp/.mc
      MC_QUIET: "true"
    volumes:
      - ./infra/minio/init.sh:/scripts/init.sh:ro
    entrypoint: ["/bin/bash", "/scripts/init.sh"]
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    networks:
      - sismowatch-net

  # -------------------------------------------------------------------------
  # Airflow: migración de metadatos + usuario admin (una vez por arranque)
  # -------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: sismowatch-airflow-init
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        echo "[airflow-init] migrando base de metadatos"
        airflow db migrate
        if airflow users list 2>/dev/null | awk -F'|' 'NR>1 {gsub(/ /,"",$2); print $2}' | grep -qx "$${AIRFLOW_ADMIN_USER}"; then
          echo "[airflow-init] el usuario $${AIRFLOW_ADMIN_USER} ya existe"
        else
          echo "[airflow-init] creando usuario admin"
          airflow users create \
            --username "$${AIRFLOW_ADMIN_USER}" \
            --password "$${AIRFLOW_ADMIN_PASSWORD}" \
            --firstname Sismo --lastname Watch \
            --role Admin \
            --email admin@sismowatch.local
        fi
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: sismowatch-airflow-webserver
    command: webserver
    ports:
      - "${AIRFLOW_HOST_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: sismowatch-airflow-scheduler
    command: scheduler
    ports:
      - "${SPARK_UI_HOST_PORT:-4040}:4040"
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      airflow-init:
        condition: service_completed_successfully

  # -------------------------------------------------------------------------
  # API: FastAPI backend (monitoreo sísmico, reportes IA, operaciones, SSE)
  # -------------------------------------------------------------------------
  api:
    image: sismowatch/api:latest
    build:
      context: .
      dockerfile: infra/api/Dockerfile
    container_name: sismowatch-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      SISMO_API_USER: ${SISMO_API_USER}
      SISMO_API_PASSWORD: ${SISMO_API_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-sismowatch_jwt_secret_dev_key_only_change_in_prod_12345}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sismowatch.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      VIEWER_EMAIL: ${VIEWER_EMAIL:-viewer@sismowatch.local}
      VIEWER_PASSWORD: ${VIEWER_PASSWORD:-viewer123}
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma:2b}
      AIRFLOW_BASE_URL: http://airflow-webserver:8080
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      - ./api:/app

    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sismowatch-net

  # -------------------------------------------------------------------------
  # Web: Frontend Vue 3 + TypeScript + Tailwind CSS (3 vistas + SSE + Leaflet)
  # -------------------------------------------------------------------------
  web:
    image: sismowatch/web:latest
    build:
      context: .
      dockerfile: infra/web/Dockerfile
    container_name: sismowatch-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - sismowatch-net
  # -------------------------------------------------------------------------
  # OpenMetadata (Catálogo, Linaje y Gobernanza — profile: governance ADR-006)
  # Solo se levanta cuando se pasa explícitamente --profile governance
  # -------------------------------------------------------------------------
  openmetadata-mysql:
    image: openmetadata/db:2.0.6
    container_name: sismowatch-openmetadata-mysql
    profiles:
      - governance
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${OM_DB_PASSWORD:-mC4iM6RrWQeSSKTBel5QNR0qIL9rlLr4}
    ports:
      - "${OM_MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - om_mysql_data:/var/lib/mysql
    networks:
      - sismowatch-net

  openmetadata-search:
    image: opensearchproject/opensearch:2.11.0
    container_name: sismowatch-openmetadata-search
    profiles:
      - governance
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ports:
      - "${OM_OPENSEARCH_HOST_PORT:-9201}:9200"
    volumes:
      - om_search_data:/usr/share/opensearch/data
    networks:
      - sismowatch-net

  openmetadata-server:
    image: openmetadata/server:2.0.6
    container_name: sismowatch-openmetadata-server
    profiles:
      - governance
    restart: unless-stopped
    environment:
      SERVER_PORT: 8585
      SERVER_ADMIN_PORT: 8586
      OPENMETADATA_HEAP_OPTS: "-Xms512M -Xmx1G"
      DB_HOST: openmetadata-mysql
      DB_PORT: "3306"
      DB_USER: openmetadata_user
      DB_USER_PASSWORD: openmetadata_password
      OM_DATABASE: openmetadata_db
      ELASTICSEARCH_HOST: openmetadata-search
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_SCHEME: http
      SEARCH_TYPE: opensearch
      AUTHENTICATION_PROVIDER: basic
      AUTHENTICATION_ENABLE_SELF_SIGNUP: "true"
      JWT_ISSUER: "open-metadata.org"
      JWT_KEY_ID: "Gb389a-9f76-gdjs-a92j-0242bk94356"
      PIPELINE_SERVICE_CLIENT_ENABLED: "false"
    ports:
      - "${OPENMETADATA_HOST_PORT:-8585}:8585"
    depends_on:
      - openmetadata-mysql
      - openmetadata-search
    networks:
      - sismowatch-net

volumes:
  pgdata:
    name: sismowatch_pgdata
  minio_data:
    name: sismowatch_minio_data
  airflow_logs:
    name: sismowatch_airflow_logs
  om_mysql_data:
    name: sismowatch_om_mysql_data
  om_search_data:
    name: sismowatch_om_search_data

networks:
  sismowatch-net:
    name: sismowatch-net
    driver: bridge

